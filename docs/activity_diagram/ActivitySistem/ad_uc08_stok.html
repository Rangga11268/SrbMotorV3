<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Activity Diagram – UC-08 Stok Motor</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap");

            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #fdfcf9; font-family: "Crimson Pro", Georgia, serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
            .page-header { text-align: center; margin-bottom: 30px; }
            .page-header h1 { font-size: 28px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.5px; margin-bottom: 8px; }
            .page-header p { font-size: 16px; color: #64748b; font-style: italic; }
            
            .diagram-container { background: #ffffff; padding: 40px; border: 1px solid #e2e8f0; box-shadow: 0 10px 50px rgba(0, 0, 0, 0.05); position: relative; }

            /* UML Styles */
            .swimlane-border { fill: none; stroke: #cbd5e1; stroke-width: 1; }
            .swimlane-header-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
            .swimlane-label { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; fill: #475569; text-anchor: middle; }
            .node-start { fill: #1e293b; }
            .node-end-outer { fill: none; stroke: #1e293b; stroke-width: 1.5; }
            .node-end-inner { fill: #1e293b; }
            
            .activity-rect { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
            .activity-text { font-size: 12px; font-weight: 600; text-anchor: middle; fill: #1e293b; }
            .decision-diamond { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
            .flow-line { stroke: #1e293b; stroke-width: 1.2; fill: none; }
            .condition-text { font-size: 11px; font-style: italic; font-weight: 700; fill: #2563eb; }

            .btn-print { margin-top: 30px; padding: 10px 20px; background: #1e293b; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: "JetBrains Mono", monospace; font-size: 12px; transition: background 0.2s; }
            .btn-print:hover { background: #334155; }
            
            @media print {
                .btn-print { display: none; }
                body { padding: 0; background: white; }
                .diagram-container { box-shadow: none; border: none; padding: 0; }
            }
        </style>
    </head>
    <body>
        <div class="page-header">
            <h1>Activity Diagram: UC-08 Stok Motor</h1>
            <p>Manajemen Inventaris & Update Katalog Real-time</p>
        </div>

        <div class="diagram-container">
            <svg width="600" height="850" viewBox="0 0 600 850">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#1e293b" />
                    </marker>
                </defs>

                <!-- Swimlanes Background -->
                <rect x="0" y="0" width="300" height="800" class="swimlane-border" />
                <rect x="300" y="0" width="300" height="800" class="swimlane-border" />

                <!-- Swimlanes Headers -->
                <rect x="0" y="0" width="300" height="40" class="swimlane-header-bg" />
                <rect x="300" y="0" width="300" height="40" class="swimlane-header-bg" />

                <text x="150" y="25" class="swimlane-label">ADMIN</text>
                <text x="450" y="25" class="swimlane-label">SISTEM</text>

                <!-- Start Node -->
                <circle cx="150" cy="80" r="10" class="node-start" />
                <line x1="150" y1="90" x2="150" y2="120" class="flow-line" marker-end="url(#arrowhead)" />

                <rect x="65" y="120" width="170" height="40" class="activity-rect" />
                <text x="150" y="145" class="activity-text">Buka menu Stok Motor</text>
                <path d="M 235,140 L 365,140" class="flow-line" marker-end="url(#arrowhead)" />

                <rect x="365" y="120" width="170" height="40" class="activity-rect" />
                <text x="450" y="145" class="activity-text">Tampil daftar stok</text>
                <path d="M 450,160 L 450,190 L 150,190 L 150,220" class="flow-line" marker-end="url(#arrowhead)" />

                <rect x="65" y="220" width="170" height="45" class="activity-rect" />
                <text x="150" y="242" class="activity-text">Pilih aksi, lalu</text>
                <text x="150" y="256" class="activity-text">Isi/ubah data unit</text>
                <line x1="150" y1="265" x2="150" y2="300" class="flow-line" marker-end="url(#arrowhead)" />

                <rect x="65" y="300" width="170" height="40" class="activity-rect" />
                <text x="150" y="325" class="activity-text">Simpan perubahan</text>
                <path d="M 235,320 L 365,320" class="flow-line" marker-end="url(#arrowhead)" />

                <rect x="365" y="300" width="170" height="40" class="activity-rect" />
                <text x="450" y="325" class="activity-text">Validasi duplikasi</text>
                <line x1="450" y1="340" x2="450" y2="380" class="flow-line" marker-end="url(#arrowhead)" />

                <polygon points="450,380 480,410 450,440 420,410" class="decision-diamond" />
                <text x="490" y="400" class="activity-text" style="font-size:10px">Duplikat?</text>

                <!-- Duplikat -->
                <path d="M 420,410 L 370,410 L 370,470" class="flow-line" marker-end="url(#arrowhead)" />
                <text x="385" y="400" class="condition-text">[Ya]</text>
                
                <rect x="330" y="470" width="100" height="40" class="activity-rect" stroke-dasharray="4 2" />
                <text x="380" y="490" class="activity-text" style="font-size:10px">Tampil Error</text>
                
                <path d="M 330,490 L 150,490 L 150,265" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Valid -->
                <line x1="450" y1="440" x2="450" y2="500" class="flow-line" marker-end="url(#arrowhead)" />
                <text x="460" y="480" class="condition-text">[Tidak]</text>

                <rect x="365" y="500" width="170" height="45" class="activity-rect" />
                <text x="450" y="522" class="activity-text">Update data di</text>
                <text x="450" y="536" class="activity-text">katalog publik</text>
                
                <path d="M 450,545 L 450,580 L 150,580 L 150,610" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- End Node -->
                <circle cx="150" cy="625" r="15" class="node-end-outer" />
                <circle cx="150" cy="625" r="10" class="node-end-inner" />

            </svg>
        </div>

        <button class="btn-print" onclick="window.print()">Cetak Diagram (PDF)</button>
    </body>
</html>
