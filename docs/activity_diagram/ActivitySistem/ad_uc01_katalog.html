<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Activity Diagram – UC-01 Lihat Katalog Motor</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap");

            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #fdfcf9; font-family: "Crimson Pro", Georgia, serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
            .page-header { text-align: center; margin-bottom: 30px; }
            .page-header h1 { font-size: 28px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.5px; margin-bottom: 8px; }
            .page-header p { font-size: 16px; color: #64748b; font-style: italic; }
            
            .diagram-container { background: #ffffff; padding: 40px; border: 1px solid #e2e8f0; box-shadow: 0 10px 50px rgba(0, 0, 0, 0.05); position: relative; }

            /* UML Styles */
            .swimlane-border { fill: none; stroke: #cbd5e1; stroke-width: 1; }
            .swimlane-header-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
            .swimlane-label { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; fill: #475569; text-anchor: middle; }
            .node-start { fill: #1e293b; }
            .node-end-outer { fill: none; stroke: #1e293b; stroke-width: 1.5; }
            .node-end-inner { fill: #1e293b; }
            
            .activity-rect { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
            .activity-text { font-size: 12px; font-weight: 600; text-anchor: middle; fill: #1e293b; }
            .decision-diamond { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
            .flow-line { stroke: #1e293b; stroke-width: 1.2; fill: none; }
            .condition-text { font-size: 13px; font-style: italic; font-weight: 700; fill: #2563eb; }

            .btn-print { margin-top: 30px; padding: 10px 20px; background: #1e293b; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: "JetBrains Mono", monospace; font-size: 12px; transition: background 0.2s; }
            .btn-print:hover { background: #334155; }
            
            @media print {
                .btn-print { display: none; }
                body { padding: 0; background: white; }
                .diagram-container { box-shadow: none; border: none; padding: 0; }
            }
        </style>
    </head>
    <body>
        <div class="page-header">
            <h1>Activity Diagram: UC-01 Lihat Katalog Motor</h1>
            <p>Alur Penelusuran Unit & Simulasi Kredit</p>
        </div>

        <div class="diagram-container">
            <svg width="800" height="1100" viewBox="0 0 800 1100">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#1e293b" />
                    </marker>
                </defs>

                <!-- Swimlanes Background -->
                <rect x="0" y="0" width="300" height="1050" class="swimlane-border" />
                <rect x="300" y="0" width="500" height="1050" class="swimlane-border" />

                <!-- Swimlanes Headers -->
                <rect x="0" y="0" width="300" height="40" class="swimlane-header-bg" />
                <rect x="300" y="0" width="500" height="40" class="swimlane-header-bg" />

                <text x="150" y="25" class="swimlane-label">GUEST / CUSTOMER</text>
                <text x="550" y="25" class="swimlane-label">SISTEM</text>

                <!-- Start Node -->
                <circle cx="150" cy="80" r="10" class="node-start" />
                <line x1="150" y1="90" x2="150" y2="120" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Step 1: Buka Katalog -->
                <rect x="65" y="120" width="170" height="40" class="activity-rect" />
                <text x="150" y="145" class="activity-text">Membuka halaman katalog</text>
                <path d="M 235,140 L 465,140" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Step 2: Tampil Daftar Unit -->
                <rect x="465" y="120" width="170" height="40" class="activity-rect" />
                <text x="550" y="145" class="activity-text">Menampilkan daftar unit</text>
                <path d="M 550,160 L 550,190 L 150,190 L 150,210" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Step 3: Filter Opsional -->
                <rect x="65" y="210" width="170" height="40" class="activity-rect" />
                <text x="150" y="235" class="activity-text">Memfilter motor (Opsional)</text>
                <line x1="150" y1="250" x2="150" y2="280" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Step 4: Pilih Detail -->
                <rect x="65" y="280" width="170" height="40" class="activity-rect" />
                <text x="150" y="305" class="activity-text">Memilih unit motor</text>
                <path d="M 235,300 L 465,300" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Step 5: Tampil Detail -->
                <rect x="465" y="280" width="170" height="40" class="activity-rect" />
                <text x="550" y="305" class="activity-text">Menampilkan detail motor</text>
                <path d="M 550,320 L 550,360 L 150,360 L 150,380" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- DECISION: Simulasi Kredit? -->
                <polygon points="150,380 180,410 150,440 120,410" class="decision-diamond" />
                <text x="210" y="415" class="activity-text" style="font-size:11px">Simulasi Kredit?</text>

                <!-- NO Flow (End early) -->
                <path d="M 120,410 L 40,410 L 40,940 L 150,940" class="flow-line" />
                <text x="80" y="400" class="condition-text">[Tidak]</text>

                <!-- YES Flow (Do Simulation) -->
                <line x1="150" y1="440" x2="150" y2="480" class="flow-line" marker-end="url(#arrowhead)" />
                <text x="160" y="465" class="condition-text">[Ya]</text>

                <!-- Step 7: Isi DP & Tenor -->
                <rect x="65" y="480" width="170" height="40" class="activity-rect" />
                <text x="150" y="505" class="activity-text">Mengisi DP & Tenor Cicilan</text>
                <path d="M 235,500 L 465,500" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Step 8: Validasi Sistem -->
                <rect x="465" y="480" width="170" height="40" class="activity-rect" />
                <text x="550" y="505" class="activity-text">Memvalidasi Data Input</text>
                <line x1="550" y1="520" x2="550" y2="550" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- DECISION: Valid Data? -->
                <polygon points="550,550 580,580 550,610 520,580" class="decision-diamond" />
                <text x="590" y="575" class="activity-text" style="font-size:11px">Valid?</text>

                <!-- Invalid Flow -->
                <path d="M 520,580 L 415,580 L 415,650" class="flow-line" marker-end="url(#arrowhead)" />
                <text x="440" y="570" class="condition-text">[Tidak Valid]</text>

                <!-- Pesan Error Validasi -->
                <rect x="340" y="650" width="150" height="40" class="activity-rect" stroke-dasharray="4 2" />
                <text x="415" y="670" class="activity-text" style="font-size:11px">Pesan: DP Berlebih /</text>
                <text x="415" y="682" class="activity-text" style="font-size:11px">Tenor = 0</text>
                
                <!-- Return to Isi DP -->
                <path d="M 340,670 L 150,670 L 150,520" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Valid Flow -->
                <line x1="550" y1="610" x2="550" y2="670" class="flow-line" marker-end="url(#arrowhead)" />
                <text x="560" y="640" class="condition-text">[Valid]</text>

                <!-- DECISION: Koneksi? -->
                <polygon points="550,670 580,700 550,730 520,700" class="decision-diamond" />
                <text x="590" y="695" class="activity-text" style="font-size:11px">Koneksi?</text>

                <!-- Koneksi Gagal -->
                <path d="M 580,700 L 680,700 L 680,750" class="flow-line" marker-end="url(#arrowhead)" />
                <text x="690" y="725" class="condition-text">[Gagal]</text>
                
                <rect x="620" y="750" width="120" height="40" class="activity-rect" stroke-dasharray="4 2" />
                <text x="680" y="770" class="activity-text" style="font-size:11px">Pesan: Data tidak</text>
                <text x="680" y="782" class="activity-text" style="font-size:11px">dimuat, coba lagi</text>
                
                <!-- Loop back to Step 7 (Mengisi DP) -->
                <path d="M 680,790 L 680,880 L 20,880 L 20,500 L 65,500" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Sukses Flow -->
                <line x1="550" y1="730" x2="550" y2="780" class="flow-line" marker-end="url(#arrowhead)" />
                <text x="560" y="755" class="condition-text">[Sukses]</text>

                <!-- Step 10: Tampil Hasil -->
                <rect x="465" y="780" width="170" height="50" class="activity-rect" />
                <text x="550" y="805" class="activity-text">Menghitung & Tampil</text>
                <text x="550" y="820" class="activity-text">Estimasi Cicilan</text>
                
                <path d="M 465,805 L 235,805" class="flow-line" marker-end="url(#arrowhead)" />

                <!-- Step 11: Customer Melihat -->
                <rect x="65" y="780" width="170" height="50" class="activity-rect" />
                <text x="150" y="805" class="activity-text">Melihat hasil estimasi</text>
                <text x="150" y="820" class="activity-text">cicilan & total bayar</text>

                <!-- Join to End -->
                <path d="M 150,830 L 150,1010" class="flow-line" marker-end="url(#arrowhead)" />
                <rect x="130" y="940" width="40" height="6" class="sync-bar" />
                <path d="M 150,946 L 150,1010" class="flow-line" />

                <!-- End Node -->
                <circle cx="150" cy="1025" r="15" class="node-end-outer" />
                <circle cx="150" cy="1025" r="10" class="node-end-inner" />

            </svg>
        </div>

        <button class="btn-print" onclick="window.print()">Cetak Diagram (PDF)</button>
    </body>
</html>
