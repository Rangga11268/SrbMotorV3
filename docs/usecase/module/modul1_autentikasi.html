<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul 1: Autentikasi & Profil</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap");
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f8fafc; font-family: "Crimson Pro", Georgia, serif; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 { font-size: 26px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .page-header p { color: #64748b; font-family: sans-serif; font-size: 13px; }
        .diagram-container { background: #ffffff; padding: 40px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .system-boundary { fill: #fafafa; stroke: #cbd5e1; stroke-width: 2; }
        .system-title { font-family: sans-serif; font-size: 12px; font-weight: 800; fill: #64748b; letter-spacing: 2px; }
        .actor-line { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .actor-head { fill: #fff; stroke: #1e293b; stroke-width: 2.5; }
        .actor-name { font-family: sans-serif; font-size: 13px; font-weight: 800; text-anchor: middle; }
        .actor-desc { font-family: sans-serif; font-size: 10px; text-anchor: middle; fill: #64748b; }
        .uc-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2; }
        .uc-text { font-size: 13px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
        .uc-id { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #3b82f6; font-weight: 600; }
        .assoc-line { stroke: #475569; stroke-width: 1.5; fill: none; }
        .dep-line { stroke-width: 1.5; stroke-dasharray: 5, 4; fill: none; }
        path.include-color { stroke: #059669; fill: none; }
        text.include-color { fill: #059669; }
        path.extend-color { stroke: #d97706; fill: none; }
        text.extend-color { fill: #d97706; }
        .stereo-text { font-family: sans-serif; font-size: 11px; font-style: italic; font-weight: 800; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>Modul 1: Autentikasi &amp; Profil</h1>
        <p>Registrasi Akun, Login, dan Kelola Profil. Aktor: <strong>Guest</strong>, <strong>Customer</strong>, <strong>Admin</strong>, <strong>Montir</strong>.</p>
    </div>
    <div class="diagram-container">
        <svg width="1000" height="640" viewBox="0 0 1000 640">
            <defs>
                <marker id="arrow-include" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#059669" stroke-width="1.5" /></marker>
                <marker id="arrow-extend" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d97706" stroke-width="1.5" /></marker>
            </defs>
            <rect x="325" y="40" width="350" height="560" class="system-boundary" />
            <text x="500" y="68" class="system-title" text-anchor="middle">SISTEM SRB MOTOR (MODUL 1)</text>

            <!-- Guest -->
            <g transform="translate(150, 120)">
                <circle cx="0" cy="0" r="16" class="actor-head" />
                <line x1="0" y1="16" x2="0" y2="60" class="actor-line" />
                <line x1="-25" y1="30" x2="25" y2="30" class="actor-line" />
                <line x1="0" y1="60" x2="-20" y2="95" class="actor-line" />
                <line x1="0" y1="60" x2="20" y2="95" class="actor-line" />
                <text x="0" y="122" class="actor-name" fill="#d97706">Guest</text>
                <text x="0" y="136" class="actor-desc">Pengunjung belum login</text>
            </g>

            <!-- Customer -->
            <g transform="translate(150, 360)">
                <circle cx="0" cy="0" r="16" class="actor-head" />
                <line x1="0" y1="16" x2="0" y2="60" class="actor-line" />
                <line x1="-25" y1="30" x2="25" y2="30" class="actor-line" />
                <line x1="0" y1="60" x2="-20" y2="95" class="actor-line" />
                <line x1="0" y1="60" x2="20" y2="95" class="actor-line" />
                <text x="0" y="122" class="actor-name" fill="#059669">Customer</text>
                <text x="0" y="136" class="actor-desc">Pelanggan terdaftar</text>
            </g>

            <!-- Admin (kanan atas) -->
            <g transform="translate(850, 270)">
                <circle cx="0" cy="0" r="16" class="actor-head" />
                <line x1="0" y1="16" x2="0" y2="60" class="actor-line" />
                <line x1="-25" y1="30" x2="25" y2="30" class="actor-line" />
                <line x1="0" y1="60" x2="-20" y2="95" class="actor-line" />
                <line x1="0" y1="60" x2="20" y2="95" class="actor-line" />
                <text x="0" y="122" class="actor-name" fill="#2563eb">Admin</text>
                <text x="0" y="136" class="actor-desc">Staf dealer</text>
            </g>

            <!-- Montir (kanan bawah) -->
            <g transform="translate(850, 460)">
                <circle cx="0" cy="0" r="16" class="actor-head" />
                <line x1="0" y1="16" x2="0" y2="60" class="actor-line" />
                <line x1="-25" y1="30" x2="25" y2="30" class="actor-line" />
                <line x1="0" y1="60" x2="-20" y2="95" class="actor-line" />
                <line x1="0" y1="60" x2="20" y2="95" class="actor-line" />
                <text x="0" y="122" class="actor-name" fill="#7c3aed">Montir</text>
                <text x="0" y="136" class="actor-desc">Mekanik bengkel</text>
            </g>

            <!-- UC-03 Registrasi (Guest only) -->
            <g transform="translate(500, 150)"><ellipse cx="0" cy="0" rx="140" ry="30" class="uc-box" /><text y="-6" class="uc-id">UC-03</text><text y="12" class="uc-text">Registrasi Akun</text></g>
            <!-- UC-04 Login -->
            <g transform="translate(500, 310)"><ellipse cx="0" cy="0" rx="140" ry="30" class="uc-box" stroke="#0f172a" stroke-width="2.5" /><text y="-6" class="uc-id">UC-04</text><text y="12" class="uc-text">Login</text></g>
            <!-- UC: Kelola Profil -->
            <g transform="translate(500, 470)"><ellipse cx="0" cy="0" rx="140" ry="30" class="uc-box" /><text y="-6" class="uc-id">UC-04b</text><text y="12" class="uc-text">Kelola Profil</text></g>

            <!-- Guest → Registrasi -->
            <path d="M 166,120 C 270,120 270,150 360,150" class="assoc-line" stroke="#d97706" />
            <!-- Customer → Login -->
            <path d="M 166,360 C 270,360 270,310 360,310" class="assoc-line" stroke="#059669" />
            <!-- Customer → Kelola Profil -->
            <path d="M 166,360 C 270,360 270,470 360,470" class="assoc-line" stroke="#059669" />
            <!-- Admin → Login -->
            <path d="M 820,270 C 730,270 730,310 640,310" class="assoc-line" stroke="#2563eb" />
            <!-- Admin → Kelola Profil -->
            <path d="M 820,270 C 730,270 730,470 640,470" class="assoc-line" stroke="#2563eb" />
            <!-- Montir → Login -->
            <path d="M 820,460 C 730,460 730,310 640,310" class="assoc-line" stroke="#7c3aed" />

            <!-- Registrasi «extend» Login -->
            <path d="M 500,280 L 500,185" class="dep-line extend-color" marker-end="url(#arrow-extend)" />
            <text x="548" y="240" class="stereo-text extend-color">«extend»</text>

            <!-- Kelola Profil «include» Login -->
            <path d="M 500,440 L 500,345" class="dep-line include-color" marker-end="url(#arrow-include)" />
            <text x="548" y="395" class="stereo-text include-color">«include»</text>
        </svg>
    </div>
</body>
</html>
