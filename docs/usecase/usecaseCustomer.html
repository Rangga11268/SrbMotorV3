<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Use Case Diagram – Customer (Authenticated)</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #fdfcf9;
                font-family: "Crimson Pro", Georgia, serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px 24px;
            }

            .page-header {
                text-align: center;
                margin-bottom: 20px;
            }

            .page-header h1 {
                font-size: 26px;
                font-weight: 700;
                color: #1a1a2e;
                letter-spacing: -0.5px;
            }

            .diagram-container {
                background: #ffffff;
                padding: 30px;
                border: 1px solid #e2e8f0;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            }

            /* UML Styles */
            .system-boundary {
                fill: #fcfcfc;
                stroke: #334155;
                stroke-width: 2.5;
            }
            .system-name {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                font-weight: 700;
                fill: #94a3b8;
            }

            .actor-path {
                stroke: #0f172a;
                stroke-width: 2.2;
                fill: none;
            }
            .actor-head {
                fill: #fff;
                stroke: #0f172a;
                stroke-width: 2.2;
            }
            .actor-name {
                font-size: 13px;
                font-weight: 800;
                text-anchor: middle;
                fill: #0f172a;
            }

            .uc-ellipse {
                fill: #fff;
                stroke: #1e293b;
                stroke-width: 1.5;
                cursor: pointer;
                transition: 0.1s;
            }
            .uc-ellipse:hover {
                fill: #f8fafc;
                stroke: #2563eb;
            }
            .uc-id {
                font-family: "JetBrains Mono", monospace;
                font-size: 8px;
                fill: #2563eb;
                font-weight: 700;
            }
            .uc-text {
                font-size: 10.5px;
                font-weight: 600;
                text-anchor: middle;
                fill: #1e293b;
            }

            .sub-uc-ellipse {
                fill: #fff;
                stroke: #64748b;
                stroke-width: 1.1;
                stroke-dasharray: 4, 2;
            }
            .sub-uc-text {
                font-size: 9px;
                font-style: italic;
                fill: #475569;
                text-anchor: middle;
            }

            .assoc-line {
                stroke: #0f172a;
                stroke-width: 1.1;
                fill: none;
            }
            .dep-line {
                stroke-width: 1.1;
                stroke-dasharray: 5, 4;
                fill: none;
            }
            .include-color {
                stroke: #059669;
            }
            .extend-color {
                stroke: #d97706;
            }
            .stereo-text {
                font-size: 11px;
                font-style: italic;
                font-weight: 800;
                text-anchor: middle;
                paint-order: stroke;
                stroke: #ffffff;
                stroke-width: 3px;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .legend {
                margin-top: 20px;
                display: flex;
                gap: 25px;
                font-size: 11px;
                background: #fff;
                padding: 8px 16px;
                border: 1px solid #e2e8f0;
            }
            .leg-item {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .leg-line {
                width: 25px;
                height: 0;
                border-top: 1.5px dashed;
            }
        </style>
    </head>
    <body>
        <div class="page-header">
            <h1>Use Case Diagram: Customer (Authenticated Flow)</h1>
        </div>

        <div class="diagram-container">
            <svg width="1200" height="1100" viewBox="0 0 1200 1100">
                <defs>
                    <marker
                        id="arrow-include"
                        markerWidth="8"
                        markerHeight="8"
                        refX="7"
                        refY="4"
                        orient="auto"
                    >
                        <path
                            d="M0,0 L8,4 L0,8"
                            fill="none"
                            stroke="#059669"
                            stroke-width="1.2"
                        />
                    </marker>
                    <marker
                        id="arrow-extend"
                        markerWidth="8"
                        markerHeight="8"
                        refX="7"
                        refY="4"
                        orient="auto"
                    >
                        <path
                            d="M0,0 L8,4 L0,8"
                            fill="none"
                            stroke="#d97706"
                            stroke-width="1.2"
                        />
                    </marker>
                </defs>

                <!-- Boundary -->
                <rect
                    x="280"
                    y="40"
                    width="890"
                    height="1020"
                    class="system-boundary"
                />
                <text x="295" y="65" class="system-name">
                    SRB MOTOR v2 – SUBSISTEM CUSTOMER (AUTH REQUIRED)
                </text>

                <!-- Actor: Customer -->
                <g transform="translate(120, 500)">
                    <circle cx="0" cy="0" r="18" class="actor-head" />
                    <line x1="0" y1="18" x2="0" y2="70" class="actor-path" />
                    <line x1="-30" y1="35" x2="30" y2="35" class="actor-path" />
                    <line x1="0" y1="70" x2="-25" y2="105" class="actor-path" />
                    <line x1="0" y1="70" x2="25" y2="105" class="actor-path" />
                    <text x="0" y="135" class="actor-name">Customer</text>
                </g>

                <!-- Use Cases Group: Account & Meta -->
                <g transform="translate(480, 100)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="100"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C01
                    </text>
                    <text y="8" class="uc-text">Mengelola Profil Saya</text>
                </g>
                <g transform="translate(480, 180)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="100"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C02
                    </text>
                    <text y="8" class="uc-text">Melihat Notifikasi</text>
                </g>

                <!-- Use Cases Group: Transactions -->
                <g transform="translate(480, 300)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="100"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C10
                    </text>
                    <text y="8" class="uc-text">Melakukan Order Motor</text>
                </g>
                <g transform="translate(480, 400)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="100"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C11
                    </text>
                    <text y="8" class="uc-text">Manajemen Transaksi</text>
                </g>

                <!-- Use Cases Group: Credit Process -->
                <g transform="translate(480, 520)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="100"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C20
                    </text>
                    <text y="8" class="uc-text">Upload Dokumen Kredit</text>
                </g>
                <g transform="translate(480, 620)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="100"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C21
                    </text>
                    <text y="8" class="uc-text">Manajemen Jadwal Survei</text>
                </g>

                <!-- Use Cases Group: Installments -->
                <g transform="translate(480, 750)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="100"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C30
                    </text>
                    <text y="8" class="uc-text">Membayar Cicilan</text>
                </g>

                <g transform="translate(480, 950)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="28"
                        class="uc-ellipse"
                    />
                    <text y="-6" class="uc-id" text-anchor="middle">
                        UC-C40
                    </text>
                    <text y="8" class="uc-text">Booking Servis (Instan)</text>
                </g>

                <!-- Sub-actions / Details -->
                <g transform="translate(850, 100)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Ubah Data & Password</text>
                </g>

                <!-- Transaction Details -->
                <g transform="translate(850, 270)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">
                        Pilih Metode (Cash/Credit)
                    </text>
                </g>
                <g transform="translate(850, 330)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Pilih Cabang Dealer</text>
                </g>
                <g transform="translate(850, 400)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Membatalkan Pesanan</text>
                </g>
                <g transform="translate(1080, 400)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="70"
                        ry="20"
                        class="sub-uc-ellipse"
                    />
                    <text y="4" class="sub-uc-text" style="font-size: 7px">
                        Status: Pending
                    </text>
                </g>

                <!-- Credit Details -->
                <g transform="translate(850, 520)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">
                        Update Dokumen Ditolak
                    </text>
                </g>
                <g transform="translate(850, 600)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Konfirmasi Kehadiran</text>
                </g>
                <g transform="translate(850, 650)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Request Reschedule</text>
                </g>

                <g transform="translate(850, 720)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">
                        Bayar Sekaligus (Multi-pay)
                    </text>
                </g>
                <g transform="translate(850, 780)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Online via Midtrans</text>
                </g>
                <g transform="translate(850, 840)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Unduh Kwitansi</text>
                </g>

                <!-- Servis Details -->
                <g transform="translate(850, 950)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="120"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">
                        Terima Tiket Digital (Terkonfirmasi)
                    </text>
                </g>
                <g transform="translate(850, 1010)">
                    <ellipse
                        cx="0"
                        cy="0"
                        rx="110"
                        ry="25"
                        class="sub-uc-ellipse"
                    />
                    <text y="5" class="sub-uc-text">Membatalkan Reservasi</text>
                </g>

                <!-- Associations -->
                <g id="assoc">
                    <line
                        x1="150"
                        y1="480"
                        x2="380"
                        y2="100"
                        class="assoc-line"
                    />
                    <line
                        x1="150"
                        y1="485"
                        x2="380"
                        y2="180"
                        class="assoc-line"
                    />
                    <line
                        x1="150"
                        y1="490"
                        x2="380"
                        y2="300"
                        class="assoc-line"
                    />
                    <line
                        x1="150"
                        y1="495"
                        x2="380"
                        y2="400"
                        class="assoc-line"
                    />
                    <line
                        x1="150"
                        y1="500"
                        x2="380"
                        y2="520"
                        class="assoc-line"
                    />
                    <line
                        x1="150"
                        y1="505"
                        x2="380"
                        y2="620"
                        class="assoc-line"
                    />
                    <line
                        x1="150"
                        y1="510"
                        x2="380"
                        y2="750"
                        class="assoc-line"
                    />
                    <line
                        x1="150"
                        y1="520"
                        x2="380"
                        y2="950"
                        class="assoc-line"
                    />
                </g>

                <!-- Logical Flow (Include/Extend) -->
                <g id="deps">
                    <path
                        d="M740,100 L580,100"
                        class="dep-line include-color"
                        marker-end="url(#arrow-include)"
                    />
                    <text x="660" y="95" class="stereo-text include-color">
                        «include»
                    </text>

                    <path
                        d="M740,275 Q650,290 580,295"
                        class="dep-line include-color"
                        marker-end="url(#arrow-include)"
                    />
                    <text x="660" y="275" class="stereo-text include-color">
                        «include»
                    </text>
                    <path
                        d="M740,330 Q650,315 580,305"
                        class="dep-line include-color"
                        marker-end="url(#arrow-include)"
                    />
                    <text x="660" y="335" class="stereo-text include-color">
                        «include»
                    </text>

                    <path
                        d="M740,400 L580,400"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="395" class="stereo-text extend-color">
                        «extend»
                    </text>
                    <path
                        d="M1010,400 L960,400"
                        class="dep-line include-color"
                        marker-end="url(#arrow-include)"
                    />
                    <text x="985" y="395" class="stereo-text include-color">
                        «condition»
                    </text>

                    <path
                        d="M740,520 L580,520"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="515" class="stereo-text extend-color">
                        «extend»
                    </text>

                    <path
                        d="M740,600 Q650,615 580,620"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="605" class="stereo-text extend-color">
                        «extend»
                    </text>
                    <path
                        d="M740,650 Q650,635 580,625"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="655" class="stereo-text extend-color">
                        «extend»
                    </text>

                    <path
                        d="M740,725 Q650,740 580,745"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="725" class="stereo-text extend-color">
                        «extend»
                    </text>
                    <path
                        d="M740,775 Q650,760 580,755"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="775" class="stereo-text extend-color">
                        «extend»
                    </text>
                    <path
                        d="M740,840 Q650,810 580,765"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="820" class="stereo-text extend-color">
                        «extend»
                    </text>

                    <path
                        d="M740,950 L580,950"
                        class="dep-line include-color"
                        marker-end="url(#arrow-include)"
                    />
                    <text x="660" y="945" class="stereo-text include-color">
                        «include»
                    </text>
                    <path
                        d="M740,1010 Q650,980 580,965"
                        class="dep-line extend-color"
                        marker-end="url(#arrow-extend)"
                    />
                    <text x="660" y="995" class="stereo-text extend-color">
                        «extend»
                    </text>
                </g>
            </svg>
        </div>

        <div class="legend">
            <div class="leg-item">
                <div
                    class="leg-line"
                    style="border-top-style: solid; border-color: #0f172a"
                ></div>
                <span>Aksi Customer</span>
            </div>
            <div class="leg-item">
                <div class="leg-line include-color"></div>
                <span style="color: #059669">«include» (Wajib/Prasyarat)</span>
            </div>
            <div class="leg-item">
                <div class="leg-line extend-color"></div>
                <span style="color: #d97706">«extend» (Opsi/Tambahan)</span>
            </div>
        </div>
    </body>
</html>
