<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Use Case Diagram – Guest SRB Motor</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap");
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #fdfcf9; font-family: "Crimson Pro", Georgia, serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
            .page-header { text-align: center; margin-bottom: 20px; }
            .page-header h1 { font-size: 26px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.5px; }
            .diagram-container { background: #ffffff; padding: 30px; border: 1px solid #e2e8f0; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); }
            .system-boundary { fill: #fcfcfc; stroke: #334155; stroke-width: 2.5; }
            .system-name { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; fill: #94a3b8; }
            .actor-path { stroke: #0f172a; stroke-width: 2.2; fill: none; }
            .actor-head { fill: #fff; stroke: #0f172a; stroke-width: 2.2; }
            .actor-name { font-size: 13px; font-weight: 800; text-anchor: middle; fill: #0f172a; }
            .uc-ellipse { fill: #fff; stroke: #1e293b; stroke-width: 1.5; cursor: pointer; }
            .uc-id { font-family: "JetBrains Mono", monospace; font-size: 8px; fill: #1c69d4; font-weight: 700; }
            .uc-text { font-size: 10.5px; font-weight: 600; text-anchor: middle; fill: #1e293b; }
            .sub-uc-ellipse { fill: #fff; stroke: #64748b; stroke-width: 1.1; stroke-dasharray: 4, 2; }
            .sub-uc-text { font-size: 9px; font-style: italic; fill: #475569; text-anchor: middle; }
            .assoc-line { stroke: #0f172a; stroke-width: 1.1; fill: none; }
            .dep-line { stroke-width: 1.1; stroke-dasharray: 5, 4; fill: none; }
            .include-color { stroke: #059669; }
            .extend-color { stroke: #d97706; }
            .stereo-text { font-size: 10px; font-style: italic; font-weight: 800; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; }
            .legend { margin-top: 20px; display: flex; gap: 25px; font-size: 11px; background: #fff; padding: 8px 16px; border: 1px solid #e2e8f0; }
            .leg-item { display: flex; align-items: center; gap: 6px; }
            .leg-line { width: 25px; height: 0; border-top: 1.5px dashed; }
        </style>
    </head>
    <body>
        <div class="page-header"><h1>Use Case Diagram: Guest & Registration Flow</h1></div>
        <div class="diagram-container">
            <svg width="1180" height="1100" viewBox="0 0 1180 1100">
                <defs>
                    <marker id="arrow-include" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#059669" stroke-width="1.2" /></marker>
                    <marker id="arrow-extend" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d97706" stroke-width="1.2" /></marker>
                </defs>
                <rect x="280" y="40" width="870" height="1020" class="system-boundary" /><text x="295" y="65" class="system-name">SRB MOTOR v2 – GUEST SUBSYSTEM</text>
                <g transform="translate(120, 500)"><circle cx="0" cy="0" r="18" class="actor-head" /><line x1="0" y1="18" x2="0" y2="70" class="actor-path" /><line x1="-30" y1="35" x2="30" y2="35" class="actor-path" /><line x1="0" y1="70" x2="-25" y2="105" class="actor-path" /><line x1="0" y1="70" x2="25" y2="105" class="actor-path" /><text x="0" y="135" class="actor-name">Guest</text></g>
                <g transform="translate(480, 100)"><ellipse cx="0" cy="0" rx="100" ry="28" class="uc-ellipse" /><text y="-6" class="uc-id">UC-G01</text><text y="8" class="uc-text">Melihat Katalog Motor</text></g>
                <g transform="translate(480, 240)"><ellipse cx="0" cy="0" rx="100" ry="28" class="uc-ellipse" /><text y="-6" class="uc-id">UC-G02</text><text y="8" class="uc-text">Melihat Detail Motor</text></g>
                <g transform="translate(480, 380)"><ellipse cx="0" cy="0" rx="100" ry="28" class="uc-ellipse" /><text y="-6" class="uc-id">UC-G03</text><text y="8" class="uc-text">Informasi Umum (Tentang/FAQ)</text></g>
                <g transform="translate(480, 500)"><ellipse cx="0" cy="0" rx="100" ry="28" class="uc-ellipse" /><text y="-6" class="uc-id">UC-G04</text><text y="8" class="uc-text">Hubungi CS (Tombol Melayang)</text></g>
                <g transform="translate(480, 620)"><ellipse cx="0" cy="0" rx="100" ry="28" class="uc-ellipse" /><text y="-6" class="uc-id">UC-G07</text><text y="8" class="uc-text">Login Akun</text></g>
                <g transform="translate(480, 850)"><ellipse cx="0" cy="0" rx="100" ry="28" class="uc-ellipse" /><text y="-6" class="uc-id">UC-G06</text><text y="8" class="uc-text">Registrasi Akun</text></g>

                <g transform="translate(850, 100)"><ellipse cx="0" cy="0" rx="105" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Filter, Sort & Live Search</text></g>
                
                <!-- 3 Sub-actions for Detail Motor -->
                <g transform="translate(850, 200)"><ellipse cx="0" cy="0" rx="105" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Pilih Cabang Pengambilan</text></g>
                <g transform="translate(850, 260)"><ellipse cx="0" cy="0" rx="105" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Lihat Unit Terkait</text></g>
                <g transform="translate(850, 320)"><ellipse cx="0" cy="0" rx="105" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Simulasi Kredit</text></g>

                <g transform="translate(850, 380)"><ellipse cx="0" cy="0" rx="105" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Cek Lokasi Cabang & FAQ</text></g>

                <g transform="translate(850, 550)"><ellipse cx="0" cy="0" rx="110" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Login via Google OAuth</text></g>
                <g transform="translate(850, 620)"><ellipse cx="0" cy="0" rx="110" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Login via Email/Password</text></g>
                <g transform="translate(850, 690)"><ellipse cx="0" cy="0" rx="110" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Lupa Kata Sandi / Ingat Saya</text></g>

                <g transform="translate(850, 780)"><ellipse cx="0" cy="0" rx="110" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Registrasi via Google OAuth</text></g>
                <g transform="translate(850, 920)"><ellipse cx="0" cy="0" rx="110" ry="25" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text">Registrasi via Form Manual</text></g>
                
                <g transform="translate(1000, 1020)"><ellipse cx="0" cy="0" rx="90" ry="22" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text" style="font-weight:700">Validasi Input Data</text></g>
                <g transform="translate(1000, 850)"><ellipse cx="0" cy="0" rx="90" ry="22" class="sub-uc-ellipse" /><text y="5" class="sub-uc-text" style="font-weight:700">Verifikasi Email (Link)</text></g>

                <g class="assoc-line">
                    <line x1="150" y1="490" x2="380" y2="100" /><line x1="150" y1="495" x2="380" y2="240" />
                    <line x1="150" y1="500" x2="380" y2="380" /><line x1="150" y1="505" x2="380" y2="500" />
                    <line x1="150" y1="510" x2="380" y2="620" /><line x1="150" y1="515" x2="380" y2="850" />
                </g>

                <!-- Catalogue Extend -->
                <path d="M745,100 L580,100" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="100" class="stereo-text extend-color">«extend»</text>

                <!-- 3 CORRECTED EXTENDS FOR DETAIL MOTOR -->
                <path d="M745,200 Q650,220 580,235" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="210" class="stereo-text extend-color">«extend»</text>
                <path d="M745,260 L580,245" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="250" class="stereo-text extend-color">«extend»</text>
                <path d="M745,320 Q650,280 580,255" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="290" class="stereo-text extend-color">«extend»</text>

                <!-- Information Extend -->
                <path d="M745,380 L580,380" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="380" class="stereo-text extend-color">«extend»</text>

                <!-- Auth Extend -->
                <path d="M740,550 Q650,580 580,605" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="570" class="stereo-text extend-color">«extend»</text>
                <path d="M740,620 L580,620" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="615" class="stereo-text extend-color">«extend»</text>
                <path d="M740,690 Q650,660 580,635" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="675" class="stereo-text extend-color">«extend»</text>

                <!-- Registration Extend -->
                <path d="M740,780 Q650,810 580,835" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="800" class="stereo-text extend-color">«extend»</text>
                <path d="M740,920 Q650,890 580,865" class="dep-line extend-color" marker-end="url(#arrow-extend)" /><text x="660" y="900" class="stereo-text extend-color">«extend»</text>

                <!-- Include -->
                <path d="M960,920 Q1050,920 1000,872" class="dep-line include-color" marker-end="url(#arrow-include)" /><text x="1050" y="900" class="stereo-text include-color">«include»</text>
                <path d="M960,920 Q1000,980 1000,998" class="dep-line include-color" marker-end="url(#arrow-include)" /><text x="1040" y="960" class="stereo-text include-color">«include»</text>
            </svg>
        </div>
        <div class="legend">
            <div class="leg-item"><div class="leg-line" style="border-top-style: solid; border-color: #0f172a"></div><span>Akses Guest</span></div>
            <div class="leg-item"><div class="leg-line include-color"></div><span style="color: #059669">«include» (Panah ke Sub)</span></div>
            <div class="leg-item"><div class="leg-line extend-color"></div><span style="color: #d97706">«extend» (Panah ke Utama)</span></div>
        </div>
    </body>
</html>
